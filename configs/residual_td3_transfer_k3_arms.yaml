# M4 n11（候选）：K=3 ensemble 基线 + 全 54-D 残差（双臂 7+双手指 20）
# n10 手指残差只能把 1 个恒败变体推到临界；transfer 其余恒败变体败在 handoff 接近几何，
# 臂关节残差（每帧 ≤0.02rad，同 bound/同 shaping）提供接近向量修正，这是与 M3 的任务差异。
act_ckpts:
  - checkpoints/act_m4/checkpoints/030000/pretrained_model
  - checkpoints/act_m4/checkpoints/035000/pretrained_model
  - checkpoints/act_m4/checkpoints/040000/pretrained_model
ensemble: 0.01
out_dir: checkpoints/rl_m4_k3_arms
pool: verify_out/transfer_success_pool.json
seed: 42

episode_seconds: 25
max_frames: 200
drop_clearance: 0.02
shape_w: 2.0
shape_clip: 0.005
residual_bound: 0.02
residual_dims: [[0, 27], [27, 54]]
expl_noise: 0.5
greedy_prob: 0.5
actor_l2: 0.5

gamma_frame: 0.99
batch_size: 128
buffer_size: 200000
actor_lr: 0.00005
critic_lr: 0.00005
tau: 0.005
policy_delay: 2
target_noise: 0.2
target_noise_clip: 0.5
grad_steps_per_episode: 100
critic_warmup_transitions: 500

r_success: 0.0
r_fail: -1.0

max_transitions: 50000
eval_every_episodes: 10
