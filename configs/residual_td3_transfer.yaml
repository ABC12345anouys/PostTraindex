# M4 n6 transfer 残差 TD3：冻结 ACT（ensemble 0.01）+ raw 关节空间残差
# 跑在 lerobot-env（mujoco 3.7.0，与录数/n5 评测同物理）
# episode = reset(yaw0)+expert pick(plan_seed)+settle25 前缀 → 策略接管 ≤max_frames
act_ckpt: checkpoints/act_m4/checkpoints/040000/pretrained_model   # TODO: n5 评测后回填最优
ensemble: 0.01
out_dir: checkpoints/rl_m4
pool: verify_out/transfer_success_pool.json
seed: 42

# 交互（per-frame 决策与转移 @20Hz；M3 结论：chunk 级已证伪）
episode_seconds: 25       # 覆盖 pick+settle 前缀 + 策略段（env 内部 trunc 兜底）
max_frames: 200           # 策略接管最长帧数（与 n5 评测一致）
drop_clearance: 0.02      # 笔最低点 < TABLE_TOP_Z+0.02 持续 10 帧判失败早停
shape_w: 2.0              # 每帧 shaping：w×clip(Δpen_z,±shape_clip)（惩罚掉笔，M3 同法）
shape_clip: 0.005
residual_bound: 0.02      # |Δa| 上限 rad（手指关节 0.02≈毫米级指尖修正）
residual_dims: [[7, 27], [34, 54]]   # 左手指20 + 右手指20 = 40-D（交接关键在双手指；臂归 ACT）
expl_noise: 0.5
greedy_prob: 0.5
actor_l2: 0.5

# TD3（对齐 M3 关键数字）
gamma_frame: 0.99
batch_size: 128
buffer_size: 200000
actor_lr: 0.00005
critic_lr: 0.00005
tau: 0.005
policy_delay: 2
target_noise: 0.2
target_noise_clip: 0.5
grad_steps_per_episode: 100
critic_warmup_transitions: 500

# 终局奖励
r_success: 0.0
r_fail: -1.0

# 训练预算与评估
max_transitions: 50000
eval_every_episodes: 10   # 全变体贪心评测（13 个 (point,plan_seed)）
